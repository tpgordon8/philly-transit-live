name: CI

# Push runs only for main; every other branch is covered by its pull request, so a same-repo branch is not tested twice.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer run on the same ref (branch, or pull request merge ref) cancels the superseded one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install lint tools (package-lock.json is the pin)
        run: npm ci
      - name: Prettier (js/ and worker/)
        run: npx prettier --check "js/*.js" worker/worker.js eslint.config.js
      - name: ESLint
        run: npx eslint .

  fast:
    name: Fast suite and Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Fast suite (includes the Worker unit tests; run.py runs tests/test_worker.mjs itself)
        run: python tests/run.py --fast
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-fast
          path: tests/out
          retention-days: 7

  full:
    name: Full suite (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Full suite
        run: python tests/run.py
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-full
          path: tests/out
          retention-days: 7
