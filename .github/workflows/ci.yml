name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast suite and Worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Worker unit tests
        run: node tests/test_worker.mjs
      - name: Fast suite
        run: python tests/run.py --fast
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-fast
          path: tests/out
          retention-days: 7

  full:
    name: Full suite (main only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Full suite
        run: python tests/run.py
      - name: Keep test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-full
          path: tests/out
          retention-days: 7
