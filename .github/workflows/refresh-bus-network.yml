name: Refresh bus network

# Monthly (and on demand): rebuild data/bus-network.json from SEPTA's GTFS feed (ARCHITECTURE.md section 12.2).
# If the feed's validity window changed, open a pull request with the new file; otherwise do nothing.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Pull requests opened with GITHUB_TOKEN do not start other workflows, so this job runs the data tests itself and
# puts the result in the pull request description.

on:
  schedule:
    - cron: "17 6 3 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GTFS_URL: https://www3.septa.org/developer/gtfs_public.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remember the current feed window
        run: |
          python3 -I - <<'PY' >> "$GITHUB_ENV"
          import json
          f = json.load(open("data/bus-network.json"))["feed"]
          print(f"OLD_FEED={f['start']}-{f['end']}")
          PY
      - name: Rebuild from SEPTA
        run: python3 -I tools/build_network.py --zip-url "$GTFS_URL"
      - name: Compare feed window
        id: cmp
        run: |
          python3 -I - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          f = json.load(open("data/bus-network.json"))["feed"]
          new = f"{f['start']}-{f['end']}"
          print(f"new={new}")
          print("changed=" + ("false" if new == os.environ["OLD_FEED"] else "true"))
          PY
          grep changed= "$GITHUB_OUTPUT"
      - name: Run data tests
        if: steps.cmp.outputs.changed == 'true'
        id: tests
        run: |
          set +e
          python3 - <<'PY' > test-result.txt 2>&1
          import sys
          sys.path.insert(0, "tests")
          import test_network_data, test_data_sanity
          for fn in (test_network_data.test_network_data, test_data_sanity.test_data_sanity):
              try:
                  fn(".")
                  print("PASS", fn.__name__)
              except AssertionError as e:
                  print("FAIL", fn.__name__, e)
          PY
          cat test-result.txt
      - name: Open pull request
        if: steps.cmp.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_FEED: ${{ steps.cmp.outputs.new }}
        run: |
          branch="data/bus-network-$NEW_FEED"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data/bus-network.json
          git commit -m "Refresh bus network data (feed $NEW_FEED)"
          git push --force origin "$branch"
          {
            echo "Regenerated by tools/build_network.py from $GTFS_URL."
            echo
            echo "Feed window: $OLD_FEED -> $NEW_FEED"
            echo
            echo "Data tests:"
            echo '```'
            cat test-result.txt
            echo '```'
            echo
            echo "A FAIL above usually means route or stop counts moved more than 10 percent: check the feed, then update tests/data_baseline.json in this branch if the change is real. CI does not start automatically on bot-opened pull requests; close and reopen this one to run it."
          } > pr-body.md
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open; branch updated."
            exit 0
          fi
          gh pr create --base main --head "$branch" --title "Refresh bus network data ($NEW_FEED)" --body-file pr-body.md
